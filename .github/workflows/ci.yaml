name: CI Pipeline

on: push

jobs:
  Churn-Prediction:
    runs-on: ubuntu-latest

    # ✅ Make secrets accessible as environment variables
    env:
      MDB_URL: ${{ secrets.MDB_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: checkout-code
        uses: actions/checkout@v3

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Debug secret loading (for testing only)
        run: |
          echo "Checking if MDB_URL is set"
          if [ -z "$MDB_URL" ]; then
            echo "MDB_URL is NOT set!"
            exit 1
          else
            echo "MDB_URL is set"
          fi

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: run Pipeline
        env:
          DAGSHUB_ACCESS_TOKEN: ${{ secrets.DAGSHUB_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: dvc repro